# Issue や PR のコメントで「@claude」と呼びかけたときに Claude が返事をするワークフロー。
# 例：@claude ボタンの色をもう少し明るくして
# 呼びかけられるのは、リポジトリに書き込み権限のある人だけです。
# Claude が PR に追加で push すると「チェックとレビュー」と「関門」がもう一度動きます。
name: Claude（@claude で呼ぶ）

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 40
            --allowedTools "Bash(bash scripts/check.sh)"
            --append-system-prompt "CLAUDE.md のルールに必ず従う。ファイルを変えたら、push する前に bash scripts/check.sh を実行して、通るまで直す。返事は日本語で、専門用語をなるべく使わずに書く。"
